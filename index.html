<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEONMAIL</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --cyan: #00f0ff;
  --pink: #ff00a0;
  --bg: #0a0a14;
  --card: rgba(255,255,255,.04);
  --border: rgba(0,240,255,.12);
  --text: #c8c8e8;
  --dim: #606080;
}

body {
  font-family: 'Rajdhani', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding: 80px 20px 40px;
}

/* NAV */
.nav {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  padding: 14px 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: rgba(10,10,20,.92);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
  z-index: 100;
}

.nav-logo {
  font-family: 'Orbitron', sans-serif;
  font-size: 18px;
  font-weight: 800;
  color: var(--cyan);
  letter-spacing: 2px;
}
.nav-logo span { color: var(--pink); }

.nav-status {
  font-family: 'Share Tech Mono', monospace;
  font-size: 10px;
  color: var(--dim);
  display: flex;
  align-items: center;
  gap: 8px;
}

.nav-status .dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #00ff88;
  animation: blink 1.5s infinite;
}

@keyframes blink {
  0%,100%{opacity:1}
  50%{opacity:.3}
}

/* HERO */
.hero {
  max-width: 640px;
  margin: 0 auto;
  text-align: center;
  padding: 20px 0 30px;
}

.hero h1 {
  font-family: 'Orbitron', sans-serif;
  font-size: clamp(32px, 7vw, 56px);
  font-weight: 900;
  letter-spacing: 4px;
  line-height: 1.1;
  margin-bottom: 12px;
  color: #fff;
}

.hero h1 .c { color: var(--cyan); text-shadow: 0 0 30px rgba(0,240,255,.3); }
.hero h1 .p { color: var(--pink); text-shadow: 0 0 30px rgba(255,0,160,.3); }

.hero p {
  font-size: 15px;
  color: var(--dim);
  max-width: 400px;
  margin: 0 auto 30px;
  line-height: 1.6;
}

/* CARD */
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 24px;
  backdrop-filter: blur(10px);
}

.card .label {
  font-family: 'Share Tech Mono', monospace;
  font-size: 9px;
  color: var(--cyan);
  letter-spacing: 3px;
  text-transform: uppercase;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.card .label::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}

/* EMAIL BOX */
.email-box {
  display: flex;
  align-items: center;
  gap: 12px;
  background: rgba(0,0,0,.4);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px 18px;
  margin-bottom: 16px;
}

.email-box .icon {
  width: 38px;
  height: 38px;
  border: 1px solid var(--border);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--cyan);
  font-size: 15px;
  flex-shrink: 0;
}

.email-box .addr {
  flex: 1;
  font-family: 'Share Tech Mono', monospace;
  font-size: 14px;
  color: var(--text);
  word-break: break-all;
  text-align: left;
}
.email-box .addr.placeholder { color: var(--dim); }

.email-box .copy-btn {
  width: 36px;
  height: 36px;
  border: 1px solid var(--border);
  background: transparent;
  border-radius: 8px;
  color: var(--dim);
  cursor: pointer;
  transition: .2s;
  font-size: 14px;
}
.email-box .copy-btn:hover {
  border-color: var(--cyan);
  color: var(--cyan);
}

/* BUTTON ROW */
.btn-row {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.btn-row .btn {
  flex: 1;
  min-width: 100px;
  padding: 12px 20px;
  border-radius: 8px;
  font-family: 'Orbitron', sans-serif;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  cursor: pointer;
  transition: .2s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--dim);
}
.btn-row .btn:hover { transform: translateY(-1px); }
.btn-row .btn:disabled { opacity: .3; cursor: not-allowed; transform: none; }

.btn-gen {
  border-color: var(--cyan) !important;
  color: var(--cyan) !important;
  background: rgba(0,240,255,.05) !important;
}
.btn-gen:hover { box-shadow: 0 0 30px rgba(0,240,255,.15); }

.btn-del {
  border-color: var(--pink) !important;
  color: var(--pink) !important;
}
.btn-del:hover { box-shadow: 0 0 30px rgba(255,0,160,.15); }

/* INBOX */
.inbox-wrap {
  max-width: 640px;
  margin: 30px auto 0;
}

.inbox-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 4px;
  margin-bottom: 14px;
}

.inbox-header h2 {
  font-family: 'Orbitron', sans-serif;
  font-size: 16px;
  font-weight: 700;
  letter-spacing: 2px;
  color: var(--cyan);
}

.inbox-header .count {
  font-family: 'Share Tech Mono', monospace;
  font-size: 12px;
  color: #00ff88;
  padding: 2px 12px;
  border: 1px solid rgba(0,255,136,.2);
  border-radius: 4px;
}

.inbox-header .meta {
  font-family: 'Share Tech Mono', monospace;
  font-size: 9px;
  color: var(--dim);
}

/* MESSAGE LIST */
.msg-grid {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.msg-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 16px 20px;
  cursor: pointer;
  transition: .2s;
  display: flex;
  gap: 14px;
  align-items: flex-start;
}
.msg-card:hover {
  border-color: rgba(0,240,255,.25);
  background: rgba(255,255,255,.06);
  transform: translateX(4px);
}

.msg-card .avatar {
  width: 36px;
  height: 36px;
  border-radius: 8px;
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Orbitron', sans-serif;
  font-size: 13px;
  font-weight: 700;
  color: var(--cyan);
  flex-shrink: 0;
}

.msg-card .body { flex: 1; min-width: 0; }
.msg-card .top {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 4px;
}
.msg-card .from {
  font-size: 14px;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.msg-card .time {
  font-family: 'Share Tech Mono', monospace;
  font-size: 10px;
  color: var(--dim);
  flex-shrink: 0;
}
.msg-card .subj {
  font-size: 13px;
  font-weight: 600;
  color: var(--cyan);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.msg-card .prev {
  font-size: 12px;
  color: var(--dim);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.msg-card .otp-tag {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  margin-top: 6px;
  padding: 2px 10px;
  background: rgba(0,240,255,.06);
  border: 1px solid rgba(0,240,255,.15);
  border-radius: 4px;
  font-family: 'Share Tech Mono', monospace;
  font-size: 11px;
  color: var(--cyan);
}

/* EMPTY */
.empty {
  text-align: center;
  padding: 50px 20px;
  border: 1px dashed var(--border);
  border-radius: 12px;
}
.empty .icon {
  width: 56px;
  height: 56px;
  border: 1px solid var(--border);
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 16px;
  font-size: 22px;
  color: var(--dim);
}
.empty h3 {
  font-family: 'Orbitron', sans-serif;
  font-size: 14px;
  letter-spacing: 2px;
  color: var(--dim);
  margin-bottom: 4px;
}
.empty p {
  font-size: 13px;
  color: var(--dim);
}

/* MODAL */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.9);
  backdrop-filter: blur(20px);
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  opacity: 0;
  visibility: hidden;
  transition: .3s;
}
.modal.open { opacity: 1; visibility: visible; }

.modal-box {
  width: 100%;
  max-width: 640px;
  max-height: 85vh;
  background: rgba(10,10,20,.96);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  transform: scale(.95);
  transition: .3s;
}
.modal.open .modal-box { transform: scale(1); }

.modal-head {
  padding: 18px 24px;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.modal-head h3 {
  font-family: 'Orbitron', sans-serif;
  font-size: 12px;
  letter-spacing: 2px;
  color: var(--cyan);
  display: flex;
  align-items: center;
  gap: 8px;
}
.modal-close {
  width: 32px;
  height: 32px;
  border: 1px solid var(--border);
  background: transparent;
  border-radius: 6px;
  color: var(--dim);
  cursor: pointer;
  font-size: 16px;
  transition: .2s;
}
.modal-close:hover { border-color: var(--pink); color: var(--pink); }

.modal-body {
  padding: 24px;
  overflow-y: auto;
  flex: 1;
}

/* EMAIL CONTENT */
.email-content {
  font-size: 14px;
  line-height: 1.8;
}
.email-content p { margin-bottom: 12px; }
.email-content a {
  color: var(--cyan);
  text-decoration: underline;
  word-break: break-all;
}
.email-content a:hover { color: var(--pink); }

/* LINK WRAPPER */
.link-wrap {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 12px 0;
  padding: 12px 16px;
  background: rgba(0,240,255,.04);
  border: 1px solid var(--border);
  border-radius: 8px;
  flex-wrap: wrap;
}
.link-wrap .link-text { flex: 1; min-width: 80px; word-break: break-all; font-size: 13px; }
.link-wrap .link-text a { color: var(--cyan); }
.link-wrap .actions { display: flex; gap: 6px; flex-shrink: 0; }
.link-wrap .actions button {
  padding: 4px 12px;
  border: 1px solid var(--border);
  background: rgba(255,255,255,.04);
  border-radius: 4px;
  color: var(--dim);
  cursor: pointer;
  font-size: 11px;
  font-family: 'Share Tech Mono', monospace;
  transition: .2s;
}
.link-wrap .actions button:hover {
  border-color: var(--cyan);
  color: var(--cyan);
  background: rgba(0,240,255,.05);
}

/* OTP BOX */
.otp-box {
  background: rgba(0,240,255,.04);
  border: 1px solid rgba(0,240,255,.15);
  border-radius: 10px;
  padding: 16px 20px;
  margin-bottom: 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
}
.otp-box .lbl {
  font-family: 'Share Tech Mono', monospace;
  font-size: 9px;
  color: var(--cyan);
  letter-spacing: 2px;
  text-transform: uppercase;
}
.otp-box .code {
  font-family: 'Share Tech Mono', monospace;
  font-size: 28px;
  font-weight: 700;
  color: var(--cyan);
  letter-spacing: 6px;
}
.otp-box .copy-otp {
  padding: 6px 16px;
  border: 1px solid var(--cyan);
  background: rgba(0,240,255,.05);
  border-radius: 6px;
  color: var(--cyan);
  cursor: pointer;
  font-family: 'Share Tech Mono', monospace;
  font-size: 11px;
  transition: .2s;
}
.otp-box .copy-otp:hover { background: rgba(0,240,255,.1); }

/* DETAIL META */
.detail-subj {
  font-family: 'Orbitron', sans-serif;
  font-size: 17px;
  font-weight: 700;
  margin-bottom: 14px;
}
.detail-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 20px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border);
}
.detail-meta span {
  padding: 4px 12px;
  background: rgba(255,255,255,.03);
  border: 1px solid var(--border);
  border-radius: 4px;
  font-family: 'Share Tech Mono', monospace;
  font-size: 10px;
  color: var(--dim);
  display: flex;
  align-items: center;
  gap: 6px;
}
.detail-meta span i { color: var(--cyan); }

/* TOAST */
.toast-stack {
  position: fixed;
  bottom: 20px;
  right: 20px;
  z-index: 2000;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.toast {
  padding: 10px 18px;
  border-radius: 6px;
  font-family: 'Share Tech Mono', monospace;
  font-size: 11px;
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 8px;
  animation: slideIn .3s;
}
@keyframes slideIn {
  from { transform: translateX(100%); opacity: 0; }
  to { transform: translateX(0); opacity: 1; }
}
.toast.ok { background: rgba(0,255,136,.08); color: #00ff88; border-color: rgba(0,255,136,.2); }
.toast.err { background: rgba(255,0,160,.08); color: var(--pink); border-color: rgba(255,0,160,.2); }
.toast.inf { background: rgba(0,240,255,.08); color: var(--cyan); border-color: rgba(0,240,255,.2); }

/* SPINNER */
.spin {
  display: inline-block;
  width: 14px;
  height: 14px;
  border: 2px solid rgba(0,240,255,.1);
  border-top-color: var(--cyan);
  border-radius: 50%;
  animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* RESPONSIVE */
@media (max-width: 600px) {
  body { padding: 70px 12px 30px; }
  .nav { padding: 10px 16px; }
  .nav-logo { font-size: 15px; }
  .card { padding: 18px; }
  .email-box { padding: 10px 14px; }
  .email-box .addr { font-size: 12px; }
  .btn-row .btn { min-width: 80px; padding: 10px 14px; font-size: 9px; }
  .modal-body { padding: 16px; }
  .otp-box .code { font-size: 22px; letter-spacing: 4px; }
  .link-wrap { flex-direction: column; align-items: stretch; }
  .link-wrap .actions { justify-content: center; }
}

::-webkit-scrollbar { width: 3px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-logo">NEON<span>MAIL</span></div>
  <div class="nav-status">
    <span class="dot"></span>
    <span id="connTxt">READY</span>
  </div>
</nav>

<section class="hero">
  <h1>
    <span class="c">TEMP</span><span class="p">ORARY</span><br>
    INBOX
  </h1>
  <p>Disposable email instantly. Receive OTPs & verification codes.</p>

  <div class="card">
    <div class="label"><i class="fas fa-terminal"></i> Target Address</div>

    <div class="email-box">
      <div class="icon"><i class="fas fa-envelope"></i></div>
      <div class="addr placeholder" id="emailDisplay">GENERATE NEW ADDRESS</div>
      <button class="copy-btn" id="copyBtn" onclick="copyEmail()" disabled><i class="fas fa-copy"></i></button>
    </div>

    <div class="btn-row">
      <button class="btn btn-gen" id="genBtn" onclick="generateEmail()">
        <i class="fas fa-rocket"></i> Generate
      </button>
      <button class="btn" id="refBtn" onclick="refreshInbox()" disabled>
        <i class="fas fa-sync" id="refIcon"></i> Refresh
      </button>
      <button class="btn btn-del" id="delBtn" onclick="deleteAccount()" disabled>
        <i class="fas fa-trash"></i> Delete
      </button>
    </div>
  </div>
</section>

<section class="inbox-wrap">
  <div class="inbox-header">
    <div>
      <h2>INBOX</h2>
      <span class="count" id="msgCount">0</span>
    </div>
    <div class="meta" id="lastRef">STANDBY</div>
  </div>

  <div class="msg-grid" id="msgList">
    <div class="empty">
      <div class="icon"><i class="fas fa-inbox"></i></div>
      <h3>NO SIGNAL</h3>
      <p>Generate email to start receiving transmissions.</p>
    </div>
  </div>
</section>

<div class="modal" id="modalBg">
  <div class="modal-box">
    <div class="modal-head">
      <h3><i class="fas fa-envelope"></i> TRANSMISSION</h3>
      <button class="modal-close" onclick="closeModal()"><i class="fas fa-xmark"></i></button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<div class="toast-stack" id="toastStack"></div>

<script>
const TEMPY_API = 'https://tempy.email/api/v1';

let account = null;
let messages = [];
let refreshTimer = null;
let isGenerating = false;

/* =========================================================
   API
   ========================================================= */
const API = {
  async request(url, options = {}) {
    const res = await fetch(url, {
      ...options,
      headers: { 'Accept': 'application/json', ...(options.headers || {}) }
    });
    let data = null;
    const text = await res.text();
    if (text) { try { data = JSON.parse(text); } catch { data = text; } }
    if (!res.ok) {
      let msg = 'HTTP ' + res.status;
      if (data) {
        if (typeof data === 'string') msg += ': ' + data.slice(0, 150);
        else if (data.error) msg += ': ' + data.error;
        else if (data.message) msg += ': ' + data.message;
      }
      throw new Error(msg);
    }
    return data;
  },
  createMailbox() { return this.request(TEMPY_API + '/mailbox', { method: 'POST' }); },
  getMessages(email) { return this.request(TEMPY_API + '/mailbox/' + encodeURIComponent(email) + '/messages'); },
  getMailbox(email) { return this.request(TEMPY_API + '/mailbox/' + encodeURIComponent(email)); },
  deleteMailbox(email) { return this.request(TEMPY_API + '/mailbox/' + encodeURIComponent(email), { method: 'DELETE' }); }
};

/* =========================================================
   GENERATE
   ========================================================= */
async function generateEmail() {
  if (isGenerating) return;
  if (account) {
    if (!confirm('Buat email baru? Email lama akan dihapus.')) return;
    try { await API.deleteMailbox(account.email); } catch(e) {}
    clearSession(false);
  }

  const btn = document.getElementById('genBtn');
  const orig = btn.innerHTML;
  btn.disabled = true;
  isGenerating = true;
  btn.innerHTML = '<div class="spin"></div> Creating...';

  try {
    const result = await API.createMailbox();
    if (!result?.email) throw new Error('API tidak mengembalikan email');
    account = { email: result.email, webUrl: result.webUrl || null, expiresAt: result.expiresAt || null, createdAt: Date.now() };
    messages = [];
    localStorage.setItem('neonmail_session', JSON.stringify(account));
    updateUI();
    toast('>> Generated: ' + account.email, 'ok');
    renderMessages();
    await refreshInbox();
  } catch (e) {
    toast('>> Generate failed: ' + e.message, 'err');
  } finally {
    btn.disabled = false;
    isGenerating = false;
    btn.innerHTML = orig;
  }
}

/* =========================================================
   RESTORE SESSION
   ========================================================= */
document.addEventListener('DOMContentLoaded', async function() {
  const saved = localStorage.getItem('neonmail_session');
  if (!saved) return;
  try {
    const data = JSON.parse(saved);
    if (data?.email) {
      account = data;
      updateUI();
      toast('>> Session restored', 'inf');
      try {
        await API.getMailbox(account.email);
        await refreshInbox();
      } catch(e) {
        if (/404|expired|deactivated/i.test(e.message)) {
          toast('>> Mailbox expired', 'err');
          clearSession(false);
        }
      }
    }
  } catch(e) { localStorage.removeItem('neonmail_session'); }
});

/* =========================================================
   UI
   ========================================================= */
function updateUI() {
  const el = document.getElementById('emailDisplay');
  el.textContent = account.email;
  el.classList.remove('placeholder');
  document.getElementById('copyBtn').disabled = false;
  document.getElementById('refBtn').disabled = false;
  document.getElementById('delBtn').disabled = false;
}

/* =========================================================
   REFRESH
   ========================================================= */
async function refreshInbox() {
  if (!account?.email) { toast('>> No active session', 'err'); return; }
  const btn = document.getElementById('refBtn');
  const icon = document.getElementById('refIcon');
  icon.classList.add('fa-spin');
  btn.disabled = true;
  try {
    const data = await API.getMessages(account.email);
    messages = Array.isArray(data) ? data : (data?.messages || data?.emails || data?.data || []);
    renderMessages();
    document.getElementById('msgCount').textContent = messages.length;
    document.getElementById('lastRef').textContent = 'SCAN: ' + new Date().toLocaleTimeString('id-ID', { hour:'2-digit', minute:'2-digit', second:'2-digit' });
    if (messages.length) toast('>> ' + messages.length + ' message' + (messages.length > 1 ? 's' : '') + ' received', 'inf');
  } catch(e) {
    if (/404|expired|deactivated/i.test(e.message)) {
      toast('>> Mailbox expired', 'err');
      clearSession(false);
    } else {
      toast('>> Refresh failed: ' + e.message, 'err');
    }
  } finally {
    icon.classList.remove('fa-spin');
    btn.disabled = !account;
  }
}

/* =========================================================
   RENDER
   ========================================================= */
function renderMessages() {
  const container = document.getElementById('msgList');
  document.getElementById('msgCount').textContent = messages.length || 0;
  if (!messages?.length) {
    container.innerHTML = `<div class="empty"><div class="icon"><i class="fas fa-inbox"></i></div><h3>NO SIGNAL</h3><p>Waiting for incoming transmissions...</p></div>`;
    return;
  }
  container.innerHTML = messages.map((msg, i) => {
    const from = cleanFromName(getFrom(msg));
    const subj = getSubject(msg);
    const body = getBody(msg);
    const otp = extractOTP(subj + ' ' + body);
    const time = formatDate(getDate(msg));
    return `<div class="msg-card" onclick="openMessage(${i})">
      <div class="avatar">${esc(from.charAt(0) || '?').toUpperCase()}</div>
      <div class="body">
        <div class="top"><span class="from">${esc(from)}</span><span class="time">${esc(time)}</span></div>
        <div class="subj">${esc(subj)}</div>
        <div class="prev">${esc(body.slice(0, 160))}</div>
        ${otp ? `<div class="otp-tag"><i class="fas fa-shield-halved"></i> OTP: ${esc(otp)}</div>` : ''}
      </div>
    </div>`;
  }).join('');
}

function getFrom(m) { return m?.from || m?.sender || 'Unknown'; }
function getSubject(m) { return String(m?.subject || m?.title || 'No Subject'); }
function getBody(m) { return String(m?.body_text || m?.bodyText || m?.text || m?.body || m?.content || m?.preview || ''); }
function getDate(m) { return m?.received_at || m?.receivedAt || m?.created_at || m?.createdAt || m?.date || ''; }
function cleanFromName(f) {
  if (!f) return 'Unknown';
  const m = String(f).match(/^"?([^"<]+)"?\s*(?:<.*>)?$/);
  return m ? m[1].trim() || f : String(f).replace(/<[^>]+>/g, '').trim() || String(f);
}
function formatDate(d) {
  if (!d) return 'UNKNOWN';
  const dt = new Date(d);
  return isNaN(dt.getTime()) ? String(d) : dt.toLocaleString('id-ID', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' });
}
function formatLongDate(d) {
  if (!d) return 'UNKNOWN';
  const dt = new Date(d);
  return isNaN(dt.getTime()) ? String(d) : dt.toLocaleString('id-ID', { weekday:'long', day:'numeric', month:'long', year:'numeric', hour:'2-digit', minute:'2-digit' });
}

function extractOTP(text) {
  if (!text) return null;
  const m = text.match(/\b\d{4,8}\b/);
  return m ? m[0] : null;
}

/* =========================================================
   OPEN MESSAGE
   ========================================================= */
function openMessage(index) {
  const msg = messages[index];
  if (!msg) { toast('>> Message not found', 'err'); return; }

  const from = cleanFromName(getFrom(msg));
  const subj = getSubject(msg);
  const body = getBody(msg);
  const html = msg?.body_html || msg?.bodyHtml || msg?.html || null;
  const otp = extractOTP(subj + ' ' + body);

  let htmlContent = '';
  if (html) {
    let clean = stripDanger(html);
    clean = processLinks(clean);
    htmlContent = `<div class="email-content">${clean}</div>`;
  } else {
    let text = esc(body || 'No content');
    text = processPlainLinks(text);
    htmlContent = `<div class="email-content">${text}</div>`;
  }

  document.getElementById('modalBody').innerHTML = `
    <div class="detail-subj">${esc(subj)}</div>
    <div class="detail-meta">
      <span><i class="fas fa-user"></i> ${esc(from)}</span>
      <span><i class="fas fa-clock"></i> ${esc(formatLongDate(getDate(msg)))}</span>
      <span><i class="fas fa-tag"></i> ${esc(account.email)}</span>
    </div>
    ${otp ? `<div class="otp-box"><div><div class="lbl">Detected OTP</div><div class="code">${esc(otp)}</div></div><button class="copy-otp" onclick="copyOTP('${escJs(otp)}')"><i class="fas fa-copy"></i> Copy</button></div>` : ''}
    ${htmlContent}
  `;

  document.getElementById('modalBg').classList.add('open');
}

/* =========================================================
   LINK PROCESSING
   ========================================================= */
function processLinks(html) {
  // Ubah tag <a> jadi wrapper dengan tombol
  let processed = html.replace(/<a\s+([^>]*href=["']([^"']*)["'][^>]*)>(.*?)<\/a>/gi, function(m, attrs, href, text) {
    if (!href || href === '#' || href.trim() === '') return m;
    return `<div class="link-wrap">
      <div class="link-text"><a href="${esc(href)}" target="_blank" rel="noopener">${text || esc(href)}</a></div>
      <div class="actions">
        <button onclick="openLink('${escJs(href)}')"><i class="fas fa-external-link-alt"></i> Buka</button>
        <button onclick="copyLink('${escJs(href)}')"><i class="fas fa-copy"></i> Salin</button>
      </div>
    </div>`;
  });

  // Ubah URL mentah
  processed = processed.replace(/(https?:\/\/[^\s<>"']+)/gi, function(url) {
    if (url.match(/href=/i)) return url;
    return `<div class="link-wrap">
      <div class="link-text"><a href="${esc(url)}" target="_blank" rel="noopener">${esc(url)}</a></div>
      <div class="actions">
        <button onclick="openLink('${escJs(url)}')"><i class="fas fa-external-link-alt"></i> Buka</button>
        <button onclick="copyLink('${escJs(url)}')"><i class="fas fa-copy"></i> Salin</button>
      </div>
    </div>`;
  });

  return processed;
}

function processPlainLinks(text) {
  return text.replace(/(https?:\/\/[^\s<>"']+)/gi, function(url) {
    return `<div class="link-wrap">
      <div class="link-text"><a href="${esc(url)}" target="_blank" rel="noopener">${esc(url)}</a></div>
      <div class="actions">
        <button onclick="openLink('${escJs(url)}')"><i class="fas fa-external-link-alt"></i> Buka</button>
        <button onclick="copyLink('${escJs(url)}')"><i class="fas fa-copy"></i> Salin</button>
      </div>
    </div>`;
  });
}

function openLink(url) { if (url) window.open(url, '_blank', 'noopener,noreferrer'); }
async function copyLink(url) {
  if (!url) { toast('>> Tidak ada link', 'err'); return; }
  try { await navigator.clipboard.writeText(url); toast('>> Link disalin', 'ok'); } catch(e) {
    // Fallback
    const ta = document.createElement('textarea');
    ta.value = url;
    ta.style.cssText = 'position:fixed;opacity:0;pointer-events:none';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    toast('>> Link disalin', 'ok');
  }
}

/* =========================================================
   COPY FUNCTIONS
   ========================================================= */
async function copyEmail() {
  if (!account) return;
  try {
    await navigator.clipboard.writeText(account.email);
    toast('>> Email copied', 'ok');
  } catch(e) { toast('>> Copy failed', 'err'); }
}

async function copyOTP(otp) {
  try { await navigator.clipboard.writeText(otp); toast('>> OTP copied', 'ok'); } catch(e) { toast('>> Copy failed', 'err'); }
}

/* =========================================================
   DELETE
   ========================================================= */
async function deleteAccount() {
  if (!account) return;
  if (!confirm('Hapus email ini? Semua data akan hilang.')) return;
  const btn = document.getElementById('delBtn');
  btn.disabled = true;
  try { await API.deleteMailbox(account.email); } catch(e) {}
  clearSession(true);
  toast('>> Address terminated', 'ok');
}

/* =========================================================
   CLEAR
   ========================================================= */
function clearSession(showToast = false) {
  account = null;
  messages = [];
  if (refreshTimer) { clearInterval(refreshTimer); refreshTimer = null; }
  localStorage.removeItem('neonmail_session');
  document.getElementById('emailDisplay').textContent = 'GENERATE NEW ADDRESS';
  document.getElementById('emailDisplay').classList.add('placeholder');
  document.getElementById('copyBtn').disabled = true;
  document.getElementById('refBtn').disabled = true;
  document.getElementById('delBtn').disabled = true;
  document.getElementById('msgCount').textContent = '0';
  document.getElementById('lastRef').textContent = 'STANDBY';
  renderMessages();
  if (showToast) toast('>> Session cleared', 'ok');
}

/* =========================================================
   AUTO REFRESH
   ========================================================= */
function startAutoRefresh() {
  if (refreshTimer) clearInterval(refreshTimer);
  refreshTimer = setInterval(() => { if (account && !document.hidden) refreshInbox(); }, 12000);
}
startAutoRefresh();

/* =========================================================
   MODAL
   ========================================================= */
function closeModal() { document.getElementById('modalBg').classList.remove('open'); }
document.getElementById('modalBg').addEventListener('click', function(e) { if (e.target === this) closeModal(); });
document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeModal(); if (e.ctrlKey && e.key === 'r') { e.preventDefault(); if (account) refreshInbox(); } });

/* =========================================================
   HELPERS
   ========================================================= */
function esc(text) {
  if (text == null) return '';
  const d = document.createElement('div');
  d.textContent = String(text);
  return d.innerHTML;
}
function escJs(text) { return String(text).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\r/g,'\\r').replace(/\n/g,'\\n'); }
function stripDanger(html) {
  return String(html)
    .replace(/<script[\s\S]*?<\/script>/gi, '')
    .replace(/<style[\s\S]*?<\/style>/gi, '')
    .replace(/<iframe[\s\S]*?<\/iframe>/gi, '')
    .replace(/<object[\s\S]*?<\/object>/gi, '')
    .replace(/<embed[\s\S]*?<\/embed>/gi, '')
    .replace(/<form[\s\S]*?<\/form>/gi, '')
    .replace(/on\w+="[^"]*"/gi, '')
    .replace(/on\w+='[^']*'/gi, '');
}

/* =========================================================
   TOAST
   ========================================================= */
function toast(message, type = 'inf') {
  const stack = document.getElementById('toastStack');
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  const icons = { ok: 'fa-check-circle', err: 'fa-times-circle', inf: 'fa-info-circle' };
  el.innerHTML = '<i class="fas ' + (icons[type] || icons.inf) + '"></i> ' + message;
  stack.appendChild(el);
  setTimeout(() => {
    el.style.opacity = '0';
    el.style.transform = 'translateX(100%)';
    setTimeout(() => { if (el.parentNode) el.remove(); }, 400);
  }, 3500);
}

/* =========================================================
   INIT
   ========================================================= */
document.getElementById('connTxt').textContent = 'READY';
</script>
